name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.ENABLE_STAGING_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://melaiva-staging.prakhargupta267.workers.dev
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/app/package-lock.json

      - name: Build web app
        run: npm ci && npm run build

      - name: Install and validate API
        working-directory: workers/app
        run: npm ci && npm run check && npm test

      - name: Deploy isolated staging Worker
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy --env staging --strict
          --tag "${RELEASE_SHA}"
          --message "git=${RELEASE_SHA} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify staging readiness
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva-staging.prakhargupta267.workers.dev
        run: node scripts/readiness-smoke.mjs

      - name: Verify staging request lifecycle
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva-staging.prakhargupta267.workers.dev
          MELAIVA_SMOKE_ALLOW_WRITES: "1"
          MELAIVA_SMOKE_SKIP_PLANNER: "1"
        run: node scripts/production-smoke.mjs

      - name: Record staging provenance
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### Staging release"
            echo "- Git SHA: \`${RELEASE_SHA}\`"
            echo "- Worker: https://melaiva-staging.prakhargupta267.workers.dev"
            echo "- Versions:"
            npx wrangler versions list --env staging --json | jq -r 'reverse | .[0:5][] | "  - `\(.id)` created \(.metadata.created_on)"'
          } >> "$GITHUB_STEP_SUMMARY"
