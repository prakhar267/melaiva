name: Deploy production

on:
  workflow_dispatch:
    inputs:
      minimum_staging_soak_minutes:
        description: Minimum age of the exact-SHA staging deployment
        required: true
        default: "15"

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    outputs:
      old_deployment_id: ${{ steps.current.outputs.old_deployment_id }}
      old_version_id: ${{ steps.current.outputs.old_version_id }}
      old_versions_json: ${{ steps.current.outputs.old_versions_json }}
      old_release_sha: ${{ steps.current.outputs.old_release_sha }}
      new_version_id: ${{ steps.candidate.outputs.new_version_id }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/app/package-lock.json

      - name: Require protected main and successful exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          check_runs="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
          for required_check in validate "Analyze (actions)" "Analyze (javascript-typescript)"; do
            jq -e --arg name "${required_check}" '
              [.check_runs[] | select(.name == $name and .app.slug == "github-actions")] |
              sort_by(.started_at) | last |
              .status == "completed" and .conclusion == "success"
            ' <<< "${check_runs}" >/dev/null
          done

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Test web and release checks
        run: |
          npm run test:sites
          node --check scripts/readiness-smoke.mjs
          node --check scripts/production-smoke.mjs

      - name: Install API dependencies
        working-directory: workers/app
        run: npm ci

      - name: Validate API
        working-directory: workers/app
        run: npm run check

      - name: Test API
        working-directory: workers/app
        run: npm test

      - name: Validate Cloudflare bundle
        working-directory: workers/app
        run: npx wrangler deploy --env="" --dry-run --outdir dist/dry-run

      - name: Require exact-SHA staging provenance and soak
        id: staging
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMUM_STAGING_SOAK_MINUTES: ${{ inputs.minimum_staging_soak_minutes }}
        run: |
          [[ "${MINIMUM_STAGING_SOAK_MINUTES}" =~ ^(0|[1-9][0-9]*)$ ]]
          soak_minutes="$((10#${MINIMUM_STAGING_SOAK_MINUTES}))"
          test "${soak_minutes}" -ge 15
          test "${soak_minutes}" -le 1440
          deployments_json="$(npx wrangler deployments list --env staging --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          active_deployment_id="$(jq -er '.id' <<< "${active_deployment}")"
          active_version_id="$(jq -er '
            [.versions[] | select(.percentage == 100)] as $active |
            if ($active | length) == 1 then $active[0].version_id
            else error("expected exactly one 100% staging Worker version")
            end
          ' <<< "${active_deployment}")"
          versions_json="$(npx wrangler versions list --env staging --json)"
          tagged_count="$(jq -er --arg sha "${RELEASE_SHA}" --arg active "${active_version_id}" '
            [.[] | select(.id == $active and .annotations["workers/tag"] == $sha)] | length
          ' <<< "${versions_json}")"
          test "${tagged_count}" = "1"
          created_on="$(jq -er '.created_on' <<< "${active_deployment}")"
          created_epoch="$(date -u -d "${created_on}" +%s)"
          current_epoch="$(date -u +%s)"
          minimum_seconds="$((soak_minutes * 60))"
          test "$((current_epoch - created_epoch))" -ge "${minimum_seconds}"
          echo "deployment_id=${active_deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "version_id=${active_version_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact staging readiness
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva-staging.prakhargupta267.workers.dev
          MELAIVA_SMOKE_EXPECTED_EVIDENCE_REVISION: "5"
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_ID: ${{ steps.staging.outputs.version_id }}
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_TAG: ${{ env.RELEASE_SHA }}
        run: node scripts/readiness-smoke.mjs

      - name: Verify staging request lifecycle
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva-staging.prakhargupta267.workers.dev
          MELAIVA_SMOKE_ALLOW_WRITES: "1"
          MELAIVA_SMOKE_SKIP_PLANNER: "1"
        run: node scripts/production-smoke.mjs

      - name: Recheck immutable staging deployment
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.staging.outputs.deployment_id }}
          EXPECTED_VERSION_ID: ${{ steps.staging.outputs.version_id }}
        run: |
          deployments_json="$(npx wrangler deployments list --env staging --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          test "$(jq -er '.id' <<< "${active_deployment}")" = "${EXPECTED_DEPLOYMENT_ID}"
          jq -e --arg version "${EXPECTED_VERSION_ID}" '
            ([.versions[] | select(.version_id == $version and .percentage == 100)] | length) == 1 and
            ([.versions[] | select(.version_id != $version or .percentage != 100)] | length) == 0
          ' <<< "${active_deployment}" >/dev/null
          versions_json="$(npx wrangler versions list --env staging --json)"
          jq -e --arg sha "${RELEASE_SHA}" --arg version "${EXPECTED_VERSION_ID}" '
            [.[] | select(.id == $version and .annotations["workers/tag"] == $sha)] | length == 1
          ' <<< "${versions_json}" >/dev/null

      - name: Capture current production version
        id: current
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments_json="$(npx wrangler deployments list --env="" --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          old_deployment_id="$(jq -er '.id' <<< "${active_deployment}")"
          old_version_id="$(jq -er '
            [.versions[] | select(.percentage == 100)] as $active |
            if ($active | length) == 1 then $active[0].version_id
            else error("expected exactly one 100% production Worker version")
            end
          ' <<< "${active_deployment}")"
          jq -e --arg old "${old_version_id}" '
            ([.versions[] | select(.version_id == $old and .percentage == 100)] | length) == 1 and
            ([.versions[] | select(.version_id != $old or .percentage != 100)] | length) == 0
          ' <<< "${active_deployment}" >/dev/null
          old_release_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
          [[ "${old_release_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "${old_release_sha}" != "${RELEASE_SHA}"
          echo "old_deployment_id=${old_deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "old_version_id=${old_version_id}" >> "${GITHUB_OUTPUT}"
          echo "old_versions_json=$(jq -cS '.versions | sort_by(.version_id)' <<< "${active_deployment}")" >> "${GITHUB_OUTPUT}"
          echo "old_release_sha=${old_release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable production candidate
        id: candidate
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --env="" --strict \
            --tag "${RELEASE_SHA}" \
            --message "git=${RELEASE_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          versions_json="$(npx wrangler versions list --env="" --json)"
          new_version_id="$(jq -er --arg sha "${RELEASE_SHA}" '
            [.[] | select(.annotations["workers/tag"] == $sha)] |
            sort_by(.metadata.created_on) | last | .id
          ' <<< "${versions_json}")"
          test -n "${new_version_id}"
          echo "new_version_id=${new_version_id}" >> "${GITHUB_OUTPUT}"

  promote:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      zero_deployment_id: ${{ steps.zero.outputs.deployment_id }}
      cutover_deployment_id: ${{ steps.cutover.outputs.deployment_id }}
    env:
      RELEASE_SHA: ${{ github.sha }}
      OLD_DEPLOYMENT_ID: ${{ needs.prepare.outputs.old_deployment_id }}
      OLD_VERSION_ID: ${{ needs.prepare.outputs.old_version_id }}
      OLD_VERSIONS_JSON: ${{ needs.prepare.outputs.old_versions_json }}
      OLD_RELEASE_SHA: ${{ needs.prepare.outputs.old_release_sha }}
      NEW_VERSION_ID: ${{ needs.prepare.outputs.new_version_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/app/package-lock.json
      - name: Install Worker dependencies
        working-directory: workers/app
        run: npm ci

      - name: Add candidate at zero percent
        id: zero
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments_json="$(npx wrangler deployments list --env="" --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          test "$(jq -er '.id' <<< "${active_deployment}")" = "${OLD_DEPLOYMENT_ID}"
          jq -e --arg old "${OLD_VERSION_ID}" '
            ([.versions[] | select(.version_id == $old and .percentage == 100)] | length) == 1 and
            ([.versions[] | select(.version_id != $old or .percentage != 100)] | length) == 0
          ' <<< "${active_deployment}" >/dev/null

          zero_message="melaiva-release phase=zero expected=${OLD_DEPLOYMENT_ID} sha=${RELEASE_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          npx wrangler versions deploy --env="" --yes \
            "${OLD_VERSION_ID}@100" "${NEW_VERSION_ID}@0" \
            --message "${zero_message}"

          for attempt in {1..10}; do
            deployments_json="$(npx wrangler deployments list --env="" --json)"
            deployment_history="$(jq -cer 'sort_by(.created_on)' <<< "${deployments_json}")"
            mutation_id="$(jq -r --arg message "${zero_message}" '[.[] | select(.annotations["workers/message"] == $message)] | last? | .id? // empty' <<< "${deployment_history}")"
            mutation_index="$(jq -er --arg id "${mutation_id}" 'map(.id) | index($id)' <<< "${deployment_history}")" || true
            if test -n "${mutation_id}" && [[ "${mutation_index}" =~ ^[1-9][0-9]*$ ]]; then
              mutation_deployment="$(jq -cer --argjson index "${mutation_index}" '.[$index]' <<< "${deployment_history}")"
              if ! jq -e --arg old "${OLD_VERSION_ID}" --arg new "${NEW_VERSION_ID}" '
              ([.versions[] | select(.version_id == $old and .percentage == 100)] | length) == 1 and
              ([.versions[] | select(.version_id == $new and .percentage == 0)] | length) == 1 and
              ([.versions[] | select(.version_id != $old and .version_id != $new)] | length) == 0
              ' <<< "${mutation_deployment}" >/dev/null; then
                exit 1
              fi

              latest_deployment_id="$(jq -er 'last | .id' <<< "${deployment_history}")"
              test "${latest_deployment_id}" = "${mutation_id}" || exit 1
              predecessor="$(jq -cer --argjson index "${mutation_index}" '.[$index - 1]' <<< "${deployment_history}")"
              predecessor_id="$(jq -er '.id' <<< "${predecessor}")"
              if test "${predecessor_id}" != "${OLD_DEPLOYMENT_ID}"; then
                jq -e '
                  (.versions | length) >= 1 and (.versions | length) <= 2 and
                  ([.versions[].percentage] | add) == 100
                ' <<< "${predecessor}" >/dev/null
                mapfile -t recovery_specs < <(jq -r '.versions[] | "\(.version_id)@\(.percentage)"' <<< "${predecessor}")
                recovery_message="melaiva-release phase=race-recovery mode=preserve expected=${mutation_id} target=${predecessor_id} sha=${RELEASE_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
                npx wrangler versions deploy --env="" --yes "${recovery_specs[@]}" --message "${recovery_message}"

                recovered_history="$(npx wrangler deployments list --env="" --json | jq -cer 'sort_by(.created_on)')"
                recovered_id="$(jq -er --arg message "${recovery_message}" '[.[] | select(.annotations["workers/message"] == $message)] | last | .id' <<< "${recovered_history}")"
                recovered_index="$(jq -er --arg id "${recovered_id}" 'map(.id) | index($id)' <<< "${recovered_history}")"
                test "$(jq -er 'last | .id' <<< "${recovered_history}")" = "${recovered_id}"
                test "$(jq -er --argjson index "${recovered_index}" '.[$index - 1].id' <<< "${recovered_history}")" = "${mutation_id}"
                recovered_versions="$(jq -cS --argjson index "${recovered_index}" '.[$index].versions | sort_by(.version_id)' <<< "${recovered_history}")"
                predecessor_versions="$(jq -cS '.versions | sort_by(.version_id)' <<< "${predecessor}")"
                test "${recovered_versions}" = "${predecessor_versions}"
                echo "Detected a deployment between the zero-percent precheck and write; restored ${predecessor_id}." >&2
                exit 1
              fi

              echo "deployment_id=${mutation_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Smoke exact candidate with a version override
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_EXPECTED_EVIDENCE_REVISION: "5"
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_ID: ${{ needs.prepare.outputs.new_version_id }}
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_TAG: ${{ env.RELEASE_SHA }}
          MELAIVA_SMOKE_WORKER_NAME: melaiva
          MELAIVA_SMOKE_WORKER_VERSION_OVERRIDE: ${{ needs.prepare.outputs.new_version_id }}
        run: |
          for attempt in {1..10}; do
            if node scripts/readiness-smoke.mjs; then exit 0; fi
            if [[ "${attempt}" -eq 10 ]]; then exit 1; fi
            sleep "$((attempt < 5 ? attempt : 5))"
          done

      - name: Cut over production atomically
        id: cutover
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZERO_DEPLOYMENT_ID: ${{ steps.zero.outputs.deployment_id }}
        run: |
          deployments_json="$(npx wrangler deployments list --env="" --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          test "$(jq -er '.id' <<< "${active_deployment}")" = "${ZERO_DEPLOYMENT_ID}"
          jq -e --arg old "${OLD_VERSION_ID}" --arg new "${NEW_VERSION_ID}" '
            ([.versions[] | select(.version_id == $old and .percentage == 100)] | length) == 1 and
            ([.versions[] | select(.version_id == $new and .percentage == 0)] | length) == 1 and
            ([.versions[] | select(.version_id != $old and .version_id != $new)] | length) == 0
          ' <<< "${active_deployment}" >/dev/null

          cutover_message="melaiva-release phase=cutover expected=${ZERO_DEPLOYMENT_ID} sha=${RELEASE_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          npx wrangler versions deploy --env="" --yes \
            "${NEW_VERSION_ID}@100" \
            --message "${cutover_message}"

          for attempt in {1..10}; do
            deployments_json="$(npx wrangler deployments list --env="" --json)"
            deployment_history="$(jq -cer 'sort_by(.created_on)' <<< "${deployments_json}")"
            mutation_id="$(jq -r --arg message "${cutover_message}" '[.[] | select(.annotations["workers/message"] == $message)] | last? | .id? // empty' <<< "${deployment_history}")"
            mutation_index="$(jq -er --arg id "${mutation_id}" 'map(.id) | index($id)' <<< "${deployment_history}")" || true
            if test -n "${mutation_id}" && [[ "${mutation_index}" =~ ^[1-9][0-9]*$ ]]; then
              mutation_deployment="$(jq -cer --argjson index "${mutation_index}" '.[$index]' <<< "${deployment_history}")"
              if ! jq -e --arg new "${NEW_VERSION_ID}" '
              ([.versions[] | select(.version_id == $new and .percentage == 100)] | length) == 1 and
              ([.versions[] | select(.version_id != $new or .percentage != 100)] | length) == 0
              ' <<< "${mutation_deployment}" >/dev/null; then
                exit 1
              fi

              latest_deployment_id="$(jq -er 'last | .id' <<< "${deployment_history}")"
              test "${latest_deployment_id}" = "${mutation_id}" || exit 1
              predecessor="$(jq -cer --argjson index "${mutation_index}" '.[$index - 1]' <<< "${deployment_history}")"
              predecessor_id="$(jq -er '.id' <<< "${predecessor}")"
              if test "${predecessor_id}" != "${ZERO_DEPLOYMENT_ID}"; then
                jq -e '
                  (.versions | length) >= 1 and (.versions | length) <= 2 and
                  ([.versions[].percentage] | add) == 100
                ' <<< "${predecessor}" >/dev/null
                mapfile -t recovery_specs < <(jq -r '.versions[] | "\(.version_id)@\(.percentage)"' <<< "${predecessor}")
                recovery_message="melaiva-release phase=race-recovery mode=preserve expected=${mutation_id} target=${predecessor_id} sha=${RELEASE_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
                npx wrangler versions deploy --env="" --yes "${recovery_specs[@]}" --message "${recovery_message}"

                recovered_history="$(npx wrangler deployments list --env="" --json | jq -cer 'sort_by(.created_on)')"
                recovered_id="$(jq -er --arg message "${recovery_message}" '[.[] | select(.annotations["workers/message"] == $message)] | last | .id' <<< "${recovered_history}")"
                recovered_index="$(jq -er --arg id "${recovered_id}" 'map(.id) | index($id)' <<< "${recovered_history}")"
                test "$(jq -er 'last | .id' <<< "${recovered_history}")" = "${recovered_id}"
                test "$(jq -er --argjson index "${recovered_index}" '.[$index - 1].id' <<< "${recovered_history}")" = "${mutation_id}"
                recovered_versions="$(jq -cS --argjson index "${recovered_index}" '.[$index].versions | sort_by(.version_id)' <<< "${recovered_history}")"
                predecessor_versions="$(jq -cS '.versions | sort_by(.version_id)' <<< "${predecessor}")"
                test "${recovered_versions}" = "${predecessor_versions}"
                echo "Detected a deployment between the cutover precheck and write; restored ${predecessor_id}." >&2
                exit 1
              fi

              echo "deployment_id=${mutation_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify deployed readiness
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_EXPECTED_EVIDENCE_REVISION: "5"
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_ID: ${{ needs.prepare.outputs.new_version_id }}
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_TAG: ${{ env.RELEASE_SHA }}
        run: |
          for attempt in {1..10}; do
            if node scripts/readiness-smoke.mjs; then exit 0; fi
            if [[ "${attempt}" -eq 10 ]]; then exit 1; fi
            sleep "$((attempt < 5 ? attempt : 5))"
          done

      - name: Verify production request lifecycle
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_ALLOW_WRITES: "1"
        run: node scripts/production-smoke.mjs

      - name: Assert and record production provenance
        id: provenance
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments_json="$(npx wrangler deployments list --env="" --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          test "$(jq -er '.id' <<< "${active_deployment}")" = "${{ steps.cutover.outputs.deployment_id }}"
          active_version_id="$(jq -er '
            [.versions[] | select(.percentage == 100)] as $active |
            if ($active | length) == 1 then $active[0].version_id
            else error("expected exactly one active Worker version")
            end
          ' <<< "${active_deployment}")"
          test "${active_version_id}" = "${{ needs.prepare.outputs.new_version_id }}"
          versions_json="$(npx wrangler versions list --env="" --json)"
          active_release_count="$(jq -er --arg sha "${RELEASE_SHA}" --arg active "${active_version_id}" '
            [.[] | select(.id == $active and .annotations["workers/tag"] == $sha)] | length
          ' <<< "${versions_json}")"
          test "${active_release_count}" = "1"
          echo "version_id=${active_version_id}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Production release"
            echo "- Git SHA: \`${RELEASE_SHA}\`"
            echo "- Worker version: \`${active_version_id}\`"
            echo "- Worker: https://melaiva.prakhargupta267.workers.dev"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Advance deployed-production source tag
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.cutover.outputs.deployment_id }}
          EXPECTED_VERSION_ID: ${{ needs.prepare.outputs.new_version_id }}
        run: |
          deployments_json="$(npx wrangler deployments list --env="" --json)"
          active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
          test "$(jq -er '.id' <<< "${active_deployment}")" = "${EXPECTED_DEPLOYMENT_ID}"
          jq -e --arg version "${EXPECTED_VERSION_ID}" '
            ([.versions[] | select(.version_id == $version and .percentage == 100)] | length) == 1 and
            ([.versions[] | select(.version_id != $version or .percentage != 100)] | length) == 0
          ' <<< "${active_deployment}" >/dev/null
          remote_release_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
          test "${remote_release_sha}" = "${OLD_RELEASE_SHA}"
          git tag --force production "${RELEASE_SHA}"
          git push --force-with-lease="refs/tags/production:${OLD_RELEASE_SHA}" origin refs/tags/production
          test "$(git ls-remote origin refs/tags/production | awk '{print $1}')" = "${RELEASE_SHA}"

          worker_drifted=true
          if post_tag_deployments="$(npx wrangler deployments list --env="" --json)"; then
            post_tag_active="$(jq -cer 'sort_by(.created_on) | last' <<< "${post_tag_deployments}")"
            if jq -e --arg version "${EXPECTED_VERSION_ID}" '
              ([.versions[] | select(.version_id == $version and .percentage == 100)] | length) == 1 and
              ([.versions[] | select(.version_id != $version or .percentage != 100)] | length) == 0
            ' <<< "${post_tag_active}" >/dev/null; then
              worker_drifted=false
            fi
          fi

          if test "${worker_drifted}" = true; then
            remote_release_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
            if test "${remote_release_sha}" = "${RELEASE_SHA}"; then
              git tag --force production "${OLD_RELEASE_SHA}"
              git push --force-with-lease="refs/tags/production:${RELEASE_SHA}" origin refs/tags/production
            else
              test "${remote_release_sha}" = "${OLD_RELEASE_SHA}"
            fi
            test "$(git ls-remote origin refs/tags/production | awk '{print $1}')" = "${OLD_RELEASE_SHA}"
            echo "Production Worker changed while advancing the source tag; restored the prior tag." >&2
            exit 1
          fi

          test "$(git ls-remote origin refs/tags/production | awk '{print $1}')" = "${RELEASE_SHA}"

  reconcile:
    needs: [prepare, promote]
    if: >-
      ${{ always() &&
          needs.prepare.result == 'success' &&
          (needs.promote.result == 'failure' || needs.promote.result == 'cancelled') &&
          needs.prepare.outputs.old_version_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_SHA: ${{ github.sha }}
      OLD_DEPLOYMENT_ID: ${{ needs.prepare.outputs.old_deployment_id }}
      OLD_VERSION_ID: ${{ needs.prepare.outputs.old_version_id }}
      OLD_VERSIONS_JSON: ${{ needs.prepare.outputs.old_versions_json }}
      OLD_RELEASE_SHA: ${{ needs.prepare.outputs.old_release_sha }}
      NEW_VERSION_ID: ${{ needs.prepare.outputs.new_version_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/app/package-lock.json
      - name: Install Worker dependencies
        working-directory: workers/app
        run: npm ci
      - name: Reconcile only deployments owned by this run
        id: worker
        timeout-minutes: 15
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          jq -e '
            length >= 1 and length <= 2 and
            ([.[].percentage] | add) == 100
          ' <<< "${OLD_VERSIONS_JSON}" >/dev/null

          # A cancelled Cloudflare write can be accepted before its deployment is
          # visible in list results. Let that control-plane state settle before
          # deciding that the captured baseline is still active.
          sleep 60

          stabilize_latest() {
            local expected_id="$1"
            local expected_versions="$2"
            local stable_history
            local stable_deployment
            for stability_attempt in {1..30}; do
              sleep 2
              if ! stable_history="$(npx wrangler deployments list --env="" --json | jq -cer 'sort_by(.created_on)')"; then
                return 1
              fi
              stable_deployment="$(jq -cer 'last' <<< "${stable_history}")"
              if test "$(jq -er '.id' <<< "${stable_deployment}")" != "${expected_id}"; then
                return 1
              fi
              if test "$(jq -cS '.versions | sort_by(.version_id)' <<< "${stable_deployment}")" != "${expected_versions}"; then
                return 1
              fi
            done
          }

          reconciled=false
          final_state=""
          final_deployment_id=""
          recovery_round=0
          while true; do
            recovery_round="$((recovery_round + 1))"
            deployment_history="$(npx wrangler deployments list --env="" --json | jq -cer 'sort_by(.created_on)')"
            latest_index="$(jq -er 'length - 1' <<< "${deployment_history}")"
            latest_deployment="$(jq -cer 'last' <<< "${deployment_history}")"
            latest_id="$(jq -er '.id' <<< "${latest_deployment}")"
            latest_message="$(jq -er '.annotations["workers/message"] // ""' <<< "${latest_deployment}")"
            latest_versions="$(jq -cS '.versions | sort_by(.version_id)' <<< "${latest_deployment}")"

            if [[ "${latest_message}" != *"run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"* ]] || [[ "${latest_message}" != melaiva-release\ phase=* ]]; then
              if stabilize_latest "${latest_id}" "${latest_versions}"; then
                reconciled=true
                if test "${latest_versions}" = "${OLD_VERSIONS_JSON}"; then
                  final_state="baseline"
                else
                  echo "A newer unrelated deployment ${latest_id} is active; preserving it." >&2
                  final_state="unrelated"
                fi
                final_deployment_id="${latest_id}"
                break
              fi
              continue
            fi

            [[ "${latest_index}" =~ ^[1-9][0-9]*$ ]]
            phase="$(sed -E 's/^melaiva-release phase=([^ ]+).*$/\1/' <<< "${latest_message}")"
            mode="$(sed -E 's/^.* mode=([^ ]+).*$/\1/' <<< "${latest_message}")"
            expected_predecessor_id="$(sed -E 's/^.* expected=([0-9a-f-]{36}).*$/\1/' <<< "${latest_message}")"
            [[ "${expected_predecessor_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            predecessor="$(jq -cer --argjson index "${latest_index}" '.[$index - 1]' <<< "${deployment_history}")"
            predecessor_id="$(jq -er '.id' <<< "${predecessor}")"

            target_mode=""
            target_versions=""
            target_deployment_id=""
            if test "${predecessor_id}" != "${expected_predecessor_id}"; then
              target_mode="preserve"
              target_versions="$(jq -cS '.versions | sort_by(.version_id)' <<< "${predecessor}")"
              target_deployment_id="${predecessor_id}"
              echo "Owned deployment ${latest_id} displaced ${predecessor_id}; restoring the displaced state." >&2
            elif test "${latest_versions}" = "${OLD_VERSIONS_JSON}"; then
              if stabilize_latest "${latest_id}" "${latest_versions}"; then
                reconciled=true
                final_state="baseline"
                final_deployment_id="${latest_id}"
                break
              fi
              continue
            elif { test "${phase}" = "race-recovery" || test "${phase}" = "reconcile"; } && test "${mode}" = "preserve"; then
              annotated_target_id="$(sed -E 's/^.* target=([0-9a-f-]{36}).*$/\1/' <<< "${latest_message}")"
              if [[ "${annotated_target_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
                target_deployment_id="${annotated_target_id}"
              else
                test "${latest_index}" -ge 2
                target_deployment_id="$(jq -er --argjson index "${latest_index}" '.[$index - 2].id' <<< "${deployment_history}")"
              fi
              displaced_deployment="$(jq -cer --arg target "${target_deployment_id}" '[.[] | select(.id == $target)] | last' <<< "${deployment_history}")"
              displaced_versions="$(jq -cS '.versions | sort_by(.version_id)' <<< "${displaced_deployment}")"
              if test "${latest_versions}" = "${displaced_versions}"; then
                if stabilize_latest "${latest_id}" "${latest_versions}"; then
                  reconciled=true
                  final_state="preserved"
                  final_deployment_id="${latest_id}"
                  break
                fi
                continue
              fi
              target_mode="preserve"
              target_versions="${displaced_versions}"
              echo "Owned recovery ${latest_id} did not reproduce the displaced version state; correcting it." >&2
            elif test "${phase}" = "zero"; then
              jq -e --arg old "${OLD_VERSION_ID}" --arg new "${NEW_VERSION_ID}" '
                ([.versions[] | select(.version_id == $old and .percentage == 100)] | length) == 1 and
                ([.versions[] | select(.version_id == $new and .percentage == 0)] | length) == 1 and
                ([.versions[] | select(.version_id != $old and .version_id != $new)] | length) == 0
              ' <<< "${latest_deployment}" >/dev/null
              target_mode="baseline"
              target_versions="${OLD_VERSIONS_JSON}"
              target_deployment_id="${OLD_DEPLOYMENT_ID}"
            elif test "${phase}" = "cutover"; then
              jq -e --arg new "${NEW_VERSION_ID}" '
                ([.versions[] | select(.version_id == $new and .percentage == 100)] | length) == 1 and
                ([.versions[] | select(.version_id != $new or .percentage != 100)] | length) == 0
              ' <<< "${latest_deployment}" >/dev/null
              target_mode="baseline"
              target_versions="${OLD_VERSIONS_JSON}"
              target_deployment_id="${OLD_DEPLOYMENT_ID}"
            elif test "${phase}" = "reconcile" && test "${mode}" = "baseline"; then
              target_mode="baseline"
              target_versions="${OLD_VERSIONS_JSON}"
              target_deployment_id="${OLD_DEPLOYMENT_ID}"
              echo "Owned baseline reconciliation ${latest_id} did not reproduce the captured state; correcting it." >&2
            else
              echo "Refusing to reconcile an unknown owned deployment phase." >&2
              exit 1
            fi

            jq -e '
              length >= 1 and length <= 2 and
              ([.[].percentage] | add) == 100
            ' <<< "${target_versions}" >/dev/null
            [[ "${target_deployment_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            mapfile -t target_specs < <(jq -r '.[] | "\(.version_id)@\(.percentage)"' <<< "${target_versions}")
            reconcile_message="melaiva-release phase=reconcile mode=${target_mode} expected=${latest_id} target=${target_deployment_id} sha=${RELEASE_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} round=${recovery_round}"
            npx wrangler versions deploy --env="" --yes "${target_specs[@]}" --message "${reconcile_message}"

            propagation_attempt=0
            while true; do
              propagation_attempt="$((propagation_attempt + 1))"
              observed_history="$(npx wrangler deployments list --env="" --json | jq -cer 'sort_by(.created_on)')"
              observed_id="$(jq -r --arg message "${reconcile_message}" '[.[] | select(.annotations["workers/message"] == $message)] | last? | .id? // empty' <<< "${observed_history}")"
              if test -z "${observed_id}"; then
                if test "$((propagation_attempt % 15))" -eq 0; then
                  echo "Waiting for reconcile mutation ${reconcile_message} to become observable." >&2
                fi
                sleep 2
                continue
              fi
              observed_index="$(jq -er --arg id "${observed_id}" 'map(.id) | index($id)' <<< "${observed_history}")"
              observed_latest_id="$(jq -er 'last | .id' <<< "${observed_history}")"
              if test "${observed_latest_id}" != "${observed_id}"; then
                break
              fi
              [[ "${observed_index}" =~ ^[1-9][0-9]*$ ]]
              observed_predecessor_id="$(jq -er --argjson index "${observed_index}" '.[$index - 1].id' <<< "${observed_history}")"
              observed_versions="$(jq -cS --argjson index "${observed_index}" '.[$index].versions | sort_by(.version_id)' <<< "${observed_history}")"
              if test "${observed_predecessor_id}" != "${latest_id}" || test "${observed_versions}" != "${target_versions}"; then
                break
              fi
              if stabilize_latest "${observed_id}" "${observed_versions}"; then
                reconciled=true
                final_state="$([ "${target_mode}" = "baseline" ] && echo baseline || echo preserved)"
                final_deployment_id="${observed_id}"
                break 2
              fi
              break
            done
          done

          test "${reconciled}" = true
          echo "state=${final_state}" >> "${GITHUB_OUTPUT}"
          echo "deployment_id=${final_deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Restore production source tag with compare-and-swap
        if: always()
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stabilize_active_worker() {
            local previous_id=""
            local previous_versions=""
            local consecutive_observations=0
            local deployments_json
            local active_deployment
            local active_id
            local active_versions

            for observation_attempt in {1..60}; do
              deployments_json="$(npx wrangler deployments list --env="" --json)"
              active_deployment="$(jq -cer 'sort_by(.created_on) | last' <<< "${deployments_json}")"
              active_id="$(jq -er '.id' <<< "${active_deployment}")"
              active_versions="$(jq -cS '.versions | sort_by(.version_id)' <<< "${active_deployment}")"
              jq -e '
                length >= 1 and length <= 2 and
                ([.[].percentage] | add) == 100
              ' <<< "${active_versions}" >/dev/null

              if test "${active_id}" = "${previous_id}" && test "${active_versions}" = "${previous_versions}"; then
                consecutive_observations="$((consecutive_observations + 1))"
              else
                previous_id="${active_id}"
                previous_versions="${active_versions}"
                consecutive_observations=1
              fi
              if test "${consecutive_observations}" -ge 30; then
                STABLE_DEPLOYMENT_ID="${active_id}"
                STABLE_VERSIONS="${active_versions}"
                STABLE_MESSAGE="$(jq -er '.annotations["workers/message"] // ""' <<< "${active_deployment}")"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          candidate_is_active() {
            jq -e --arg candidate "${NEW_VERSION_ID}" '
              length == 1 and
              .[0].version_id == $candidate and
              .[0].percentage == 100
            ' <<< "$1" >/dev/null
          }

          baseline_is_active() {
            test "$1" = "${OLD_VERSIONS_JSON}"
          }

          restore_tag_mutation() {
            local previous_sha="$1"
            local changed_sha="$2"
            local current_sha
            if test "${previous_sha}" = "${changed_sha}"; then
              return 0
            fi
            current_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
            if test "${current_sha}" = "${changed_sha}"; then
              git tag --force production "${previous_sha}"
              git push --force-with-lease="refs/tags/production:${changed_sha}" origin refs/tags/production
              test "$(git ls-remote origin refs/tags/production | awk '{print $1}')" = "${previous_sha}"
            elif test "${current_sha}" != "${previous_sha}"; then
              echo "The production source tag advanced concurrently to ${current_sha}; preserving it." >&2
            fi
          }

          late_reconcile_output="$(mktemp)"
          trap 'rm -f "${late_reconcile_output}"' EXIT
          tag_reconciled=false
          tag_round=0
          while true; do
            tag_round="$((tag_round + 1))"
            : > "${late_reconcile_output}"
            GITHUB_OUTPUT="${late_reconcile_output}" \
            MELAIVA_RECONCILE_INITIAL_SETTLE_SECONDS=0 \
              bash ../../scripts/reconcile-production-deployment.sh
            reconciled_worker_id="$(awk -F= '$1 == "deployment_id" { value = $2 } END { print value }' "${late_reconcile_output}")"
            [[ "${reconciled_worker_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]

            stabilize_active_worker
            before_worker_id="${STABLE_DEPLOYMENT_ID}"
            before_worker_versions="${STABLE_VERSIONS}"
            if test "${before_worker_id}" != "${reconciled_worker_id}" && \
               [[ "${STABLE_MESSAGE}" == *"run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"* ]] && \
               [[ "${STABLE_MESSAGE}" == melaiva-release\ phase=* ]]; then
              echo "Owned deployment ${before_worker_id} became visible after reconciliation; re-entering predecessor-verified cleanup." >&2
              continue
            fi
            if candidate_is_active "${before_worker_versions}"; then
              desired_release_sha="${RELEASE_SHA}"
            elif baseline_is_active "${before_worker_versions}"; then
              desired_release_sha="${OLD_RELEASE_SHA}"
            else
              echo "Stable Worker deployment ${before_worker_id} is neither the captured baseline nor the exact candidate; preserving the source tag and failing for operator review." >&2
              exit 1
            fi
            remote_release_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
            [[ "${remote_release_sha}" =~ ^[0-9a-f]{40}$ ]]
            if test "${remote_release_sha}" != "${RELEASE_SHA}" && test "${remote_release_sha}" != "${OLD_RELEASE_SHA}"; then
              echo "A newer unrelated production source tag ${remote_release_sha} is active; preserving it." >&2
              tag_reconciled=true
              break
            fi

            if test "${remote_release_sha}" != "${desired_release_sha}"; then
              git tag --force production "${desired_release_sha}"
              if ! git push --force-with-lease="refs/tags/production:${remote_release_sha}" origin refs/tags/production; then
                remote_release_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
                if test "${remote_release_sha}" != "${RELEASE_SHA}" && test "${remote_release_sha}" != "${OLD_RELEASE_SHA}"; then
                  echo "The production source tag advanced concurrently to ${remote_release_sha}; preserving it." >&2
                  tag_reconciled=true
                  break
                fi
                continue
              fi
            fi
            test "$(git ls-remote origin refs/tags/production | awk '{print $1}')" = "${desired_release_sha}"

            stabilize_active_worker
            after_worker_id="${STABLE_DEPLOYMENT_ID}"
            after_worker_versions="${STABLE_VERSIONS}"
            if test "${after_worker_id}" != "${reconciled_worker_id}" && \
               [[ "${STABLE_MESSAGE}" == *"run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"* ]] && \
               [[ "${STABLE_MESSAGE}" == melaiva-release\ phase=* ]]; then
              restore_tag_mutation "${remote_release_sha}" "${desired_release_sha}"
              echo "Owned deployment ${after_worker_id} became visible after the tag check; restored this round's tag mutation and re-entering cleanup." >&2
              continue
            fi
            if candidate_is_active "${after_worker_versions}"; then
              verified_release_sha="${RELEASE_SHA}"
            elif baseline_is_active "${after_worker_versions}"; then
              verified_release_sha="${OLD_RELEASE_SHA}"
            else
              restore_tag_mutation "${remote_release_sha}" "${desired_release_sha}"
              echo "Worker state changed to unknown deployment ${after_worker_id}; restored any tag mutation from this round and failing for operator review." >&2
              exit 1
            fi
            verified_remote_sha="$(git ls-remote origin refs/tags/production | awk '{print $1}')"
            [[ "${verified_remote_sha}" =~ ^[0-9a-f]{40}$ ]]
            if test "${verified_remote_sha}" != "${RELEASE_SHA}" && test "${verified_remote_sha}" != "${OLD_RELEASE_SHA}"; then
              echo "The production source tag advanced concurrently to ${verified_remote_sha}; preserving it." >&2
              tag_reconciled=true
              break
            fi
            if test "${verified_remote_sha}" = "${verified_release_sha}"; then
              echo "Production source tag ${verified_remote_sha} matches stable Worker deployment ${after_worker_id}."
              tag_reconciled=true
              break
            fi
            echo "Worker state changed from ${before_worker_id} while reconciling the source tag; retrying with compare-and-swap." >&2
          done
          test "${tag_reconciled}" = true

      - name: Verify restored baseline readiness
        if: steps.worker.outputs.state == 'baseline'
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_MINIMUM_EVIDENCE_REVISION: "1"
        run: |
          for attempt in {1..10}; do
            if node scripts/readiness-smoke.mjs; then exit 0; fi
            if [[ "${attempt}" -eq 10 ]]; then exit 1; fi
            sleep "$((attempt < 5 ? attempt : 5))"
          done
