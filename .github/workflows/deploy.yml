name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/app/package-lock.json

      - name: Require the protected main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Build web app
        run: npm ci && npm run build

      - name: Install API dependencies
        working-directory: workers/app
        run: npm ci

      - name: Validate API
        working-directory: workers/app
        run: npm run check

      - name: Test API
        working-directory: workers/app
        run: npm test

      - name: Validate Cloudflare bundle
        working-directory: workers/app
        run: npx wrangler deploy --env="" --dry-run --outdir dist/dry-run

      - name: Deploy Cloudflare Worker
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy --env="" --strict
          --tag "${RELEASE_SHA}"
          --message "git=${RELEASE_SHA} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify deployed readiness
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
        run: node scripts/readiness-smoke.mjs

      - name: Assert and record production provenance
        id: provenance
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments_json="$(npx wrangler deployments list --env="" --json)"
          active_version_id="$(jq -er '
            (sort_by(.created_on) | last | [.versions[] | select(.percentage == 100)]) as $active |
            if ($active | length) == 1 then $active[0].version_id
            else error("expected exactly one active Worker version")
            end
          ' <<< "${deployments_json}")"
          versions_json="$(npx wrangler versions list --env="" --json)"
          active_release_count="$(jq -er --arg sha "${RELEASE_SHA}" --arg active "${active_version_id}" '
            [.[] | select(.id == $active and .annotations["workers/tag"] == $sha)] | length
          ' <<< "${versions_json}")"
          test "${active_release_count}" = "1"
          echo "version_id=${active_version_id}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Production release"
            echo "- Git SHA: \`${RELEASE_SHA}\`"
            echo "- Worker version: \`${active_version_id}\`"
            echo "- Worker: https://melaiva.prakhargupta267.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
