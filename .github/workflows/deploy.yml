name: Validate production release (hosted promotion disabled)

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: production-release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require protected main and successful exact-SHA gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${remote_main_sha}" = "${RELEASE_SHA}"

          check_runs="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
          for required_check in validate "Analyze (actions)" "Analyze (javascript-typescript)"; do
            jq -e --arg name "${required_check}" '
              [.check_runs[] | select(.name == $name and .app.slug == "github-actions")] |
              sort_by(.started_at) | last |
              .status == "completed" and .conclusion == "success"
            ' <<< "${check_runs}" >/dev/null
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/app/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Test web and release policy
        run: |
          npm run test:sites
          node --check scripts/readiness-smoke.mjs
          node --check scripts/production-smoke.mjs

      - name: Install API dependencies
        working-directory: workers/app
        run: npm ci

      - name: Validate API
        working-directory: workers/app
        run: npm run check

      - name: Test API
        working-directory: workers/app
        run: npm test

      - name: Validate production and staging bundles without uploading
        working-directory: workers/app
        run: |
          ./node_modules/.bin/wrangler deploy --env="" --dry-run --outdir dist/dry-run-production
          ./node_modules/.bin/wrangler deploy --env staging --dry-run --outdir dist/dry-run-staging

      - name: Smoke current default production traffic without an override
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_EXPECTED_EVIDENCE_REVISION: "5"
        run: node scripts/readiness-smoke.mjs

      - name: Record hosted production promotion block
        if: always()
        run: |
          {
            echo "### Hosted production promotion is disabled"
            echo
            echo "This workflow validates source, bundles, tests, and current default production traffic only."
            echo "It cannot upload a Worker version, change production traffic, or move the production Git tag."
            echo "Use the authenticated local release procedure from a clean checkout of the merged main SHA."
            echo "Do not treat this run as deployment evidence."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=HOSTED_PRODUCTION_PROMOTION_DISABLED::Production mutation requires the reviewed system-tools finalizer and reconciler described in the release documentation."
          exit 1
