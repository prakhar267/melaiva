name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/app/package-lock.json

      - name: Require the protected main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Build web app
        run: npm ci && npm run build

      - name: Install API dependencies
        working-directory: workers/app
        run: npm ci

      - name: Validate API
        working-directory: workers/app
        run: npm run check

      - name: Test API
        working-directory: workers/app
        run: npm test

      - name: Validate Cloudflare bundle
        working-directory: workers/app
        run: npx wrangler deploy --env="" --dry-run --outdir dist/dry-run

      - name: Deploy Cloudflare Worker
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy --env="" --strict
          --tag "${GITHUB_SHA}"
          --message "git=${GITHUB_SHA} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify deployed readiness
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
        run: node scripts/readiness-smoke.mjs

      - name: Record release provenance
        working-directory: workers/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### Production release"
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- Worker: https://melaiva.prakhargupta267.workers.dev"
            echo "- Versions:"
            npx wrangler versions list --env="" --json | jq -r 'reverse | .[0:5][] | "  - `\(.id)` created \(.metadata.created_on)"'
          } >> "$GITHUB_STEP_SUMMARY"
