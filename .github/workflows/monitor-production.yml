name: Monitor production

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      expected_evidence_revision:
        description: Exact evidence capability expected after a release
        required: true
        default: "5"
      expected_worker_version_id:
        description: Exact deployed Worker version UUID
        required: false
        default: ""
      expected_worker_version_tag:
        description: Exact deployed Worker version Git SHA tag
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployed production source
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
      - name: Check out selected release source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve checked-out release source
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check scheduled operational readiness without writes
        if: github.event_name == 'schedule'
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_TAG: ${{ steps.release.outputs.sha }}
        run: node scripts/readiness-smoke.mjs
      - name: Check exact post-release readiness without writes
        if: github.event_name == 'workflow_dispatch'
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
          MELAIVA_SMOKE_EXPECTED_EVIDENCE_REVISION: ${{ inputs.expected_evidence_revision }}
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_ID: ${{ inputs.expected_worker_version_id }}
          MELAIVA_SMOKE_EXPECTED_WORKER_VERSION_TAG: ${{ inputs.expected_worker_version_tag }}
        run: node scripts/readiness-smoke.mjs
