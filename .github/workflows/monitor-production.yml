name: Monitor production

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check production without writes
        env:
          MELAIVA_SMOKE_BASE_URL: https://melaiva.prakhargupta267.workers.dev
        run: node scripts/readiness-smoke.mjs
