name = "melaiva"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
APP_VERSION = "0.13.0"
ALLOWED_ORIGINS = ""
GEMINI_MODEL = "gemini-3.5-flash"
ENVIRONMENT = "production"
ENABLE_DEMO_CATALOG = "false"
AI_PLANNER_ENABLED = "true"
AI_DAILY_LIMIT = "100"
TURNSTILE_ENABLED = "false"

[[durable_objects.bindings]]
name = "STORE"
class_name = "MelaivaStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MelaivaStore"]

[assets]
directory = "../../dist/client"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1

[env.staging]
name = "melaiva-staging"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
APP_VERSION = "0.13.0-staging"
ALLOWED_ORIGINS = ""
GEMINI_MODEL = "gemini-3.5-flash"
ENVIRONMENT = "production"
ENABLE_DEMO_CATALOG = "false"
AI_PLANNER_ENABLED = "false"
AI_DAILY_LIMIT = "20"
TURNSTILE_ENABLED = "false"

[[env.staging.durable_objects.bindings]]
name = "STORE"
class_name = "MelaivaStore"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["MelaivaStore"]

[env.staging.assets]
directory = "../../dist/client"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
